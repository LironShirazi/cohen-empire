<!doctype html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>🌳 העץ המשפחתי — אימפריית כהן</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <a class="home-link" href="/" title="חזרה לדף הבית">🏠</a>
    <div class="titles">
      <h1>🌳 העץ המשפחתי</h1>
      <p>אימפריית כהן — ב״ה משפחה גדולה</p>
    </div>
  </header>

  <div class="toolbar">
    <button id="btn-edit" class="tb-btn" aria-pressed="false">✏️ עריכת העץ</button>
    <button id="btn-me" class="tb-btn">🙋 אני בעץ</button>
    <div class="menu-wrap">
      <button id="btn-export" class="tb-btn">⬇️ ייצוא</button>
      <div id="export-menu" class="menu hidden">
        <button data-act="png">🖼️ תמונה (PNG)</button>
        <button data-act="pdf">📄 קובץ PDF</button>
        <hr>
        <button data-act="json">💾 גיבוי נתונים (JSON)</button>
        <button data-act="import">📥 ייבוא נתונים</button>
        <hr>
        <button data-act="reset">↩️ איפוס לעץ ההתחלתי</button>
      </div>
    </div>
    <input id="search" class="tb-search" list="search-list" placeholder="🔍 חיפוש בעץ..." autocomplete="off">
    <datalist id="search-list"></datalist>
  </div>

  <main id="tree-wrap">
    <svg id="tree-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="zoom-controls">
      <button id="zoom-in" title="הגדלה">＋</button>
      <button id="zoom-out" title="הקטנה">－</button>
      <button id="zoom-fit" title="התאמה למסך">⤢</button>
    </div>
    <p class="canvas-hint">גררו לתזוזה · צביטה או גלגלת לזום · הקישו על עלה לפרטים</p>
  </main>

  <div id="sheet" class="sheet hidden"></div>
  <div id="overlay-full" class="overlay hidden"></div>
  <div id="modal" class="overlay hidden"><div class="modal-box" id="modal-box"></div></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div id="toast" class="toast hidden"></div>

  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/render.js"></script>
  <script src="js/export.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
