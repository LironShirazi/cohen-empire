<!-- @dsCard group="מסך הבית" -->
<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ספירה לאחור</title>
<link rel="stylesheet" href="../styles.css">
<style>
.cd{display:flex;gap:8px;justify-content:center;margin-top:16px}
.cd>div{background:rgba(255,255,255,.08);border:1px solid rgba(251,217,104,.35);
  border-radius:14px;min-width:66px;padding:12px 6px}
.cd b{display:block;font-family:var(--font-display);font-size:34px;color:var(--gold-lite);
  font-variant-numeric:tabular-nums;line-height:1}
.cd span{font-size:12px;color:#dfe6f5;opacity:.8}
</style>
</head>
<body>
<div class="stack" style="max-width:342px;text-align:center">
  <h1>⏳ ספירה לאחור</h1>
  <div class="cosmic card" style="border:none;box-shadow:var(--shadow-navy);padding:26px 22px">
    <span class="chip chip-yellow">🏁 יום העצמאות · בית סבא וסבתא</span>
    <div class="display goldtext" style="font-size:30px;margin-top:12px">המירוץ למיליון 2026</div>
    <div class="cd">
      <div><b>23</b><span>ימים</span></div>
      <div><b>14</b><span>שעות</span></div>
      <div><b>52</b><span>דקות</span></div>
      <div><b>08</b><span>שניות</span></div>
    </div>
  </div>
  <div class="note">גדולה, קוסמית ובועטת — הדבר הראשון שרואים בדף הבית, בדיוק כמו פתיח התוכנית.</div>
</div>
</body>
</html>
