<!-- @dsCard group="מירוץ חי" -->
<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>לידרבורד חי</title>
<link rel="stylesheet" href="../styles.css">
<style>

.row{display:flex;gap:12px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.rank{width:34px;text-align:center;font-size:22px;font-weight:800;color:var(--muted)}
.row i{width:14px;height:14px;border-radius:50%;flex:none}
.row b{font-size:17px}
</style>
</head>
<body>

<div class="stack" style="max-width:342px">
  <h1>🏅 טבלת מובילים</h1>
  <div class="card" style="padding:8px 0">
    <div class="row"><span class="rank">🥇</span><i style="background:var(--t-orange)"></i><b>האריות 🦁</b></div>
    <div class="row"><span class="rank">🥈</span><i style="background:var(--t-blue)"></i><b>הדולפינים 🐬</b></div>
    <div class="row"><span class="rank">🥉</span><i style="background:var(--t-green)"></i><b>הצבים 🐢</b></div>
    <div class="row"><span class="rank">4</span><i style="background:var(--t-purple)"></i><b>חדי־הקרן 🦄</b></div>
    <div class="row"><span class="rank">5</span><i style="background:var(--t-red)"></i><b>הנשרים 🦅</b></div>
    <div class="row"><span class="rank">6</span><i style="background:var(--t-yellow)"></i><b>הדבורים 🐝</b></div>
  </div>
  <div class="card small">⚠️ דירוג בלבד — בלי ״משימה 3 מתוך 7״. שומרים על המתח עד הסוף.
  מתעדכן בזמן אמת עם אנימציית החלפת מקומות.</div>
</div>
</body>
</html>
