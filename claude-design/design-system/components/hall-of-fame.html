<!-- @dsCard group="מורשת" -->
<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>היכל התהילה</title>
<link rel="stylesheet" href="../styles.css">
<style>
.champ{color:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-navy);
  display:flex;gap:14px;align-items:center}
.champ .cup{font-size:40px;flex:none}
.champ .year{font-family:var(--font-display);font-size:22px;color:var(--gold-lite)}
.fame{display:flex;gap:12px;align-items:center;border-inline-start:8px solid var(--team)}
.year{font-family:var(--font-display);font-size:22px;color:var(--brand);min-width:52px}
.photo{width:52px;height:52px;border-radius:12px;flex:none}
.stat{display:flex;gap:10px}
.stat .card{flex:1;text-align:center;padding:14px}
.stat b{display:block;font-family:var(--font-display);font-size:26px;color:var(--brand)}
</style>
</head>
<body>
<div class="stack" style="max-width:342px">
  <h1>🏆 היכל התהילה</h1>
  <div class="cosmic champ">
    <div class="cup">🏆</div>
    <div><div class="year">אלופי 2025</div>
      <b style="font-size:20px">חדי־הקרן 🦄</b>
      <div class="small" style="color:#c9d3ea">רות, יואב, מיכל, אבי ועוד 4</div></div>
  </div>
  <div class="card fame" style="--team:var(--t-red)">
    <div class="year">2024</div><div class="photo ph">תמונת<br>קבוצה</div>
    <div><b>הנשרים 🦅</b><div class="small">דני, שירה, עומר ועוד 5</div></div>
  </div>
  <div class="card fame" style="--team:var(--t-blue)">
    <div class="year">2023</div><div class="photo ph">תמונת<br>קבוצה</div>
    <div><b>הלווייתנים 🐋</b><div class="small">משפחת כהן הצעירה</div></div>
  </div>
  <div class="stat">
    <div class="card"><b>4</b><div class="small">זכיות · חדי־הקרן</div></div>
    <div class="card"><b>21</b><div class="small">שנות מירוץ</div></div>
  </div>
  <div class="note">20 שנות היסטוריה מוזנות ידנית · שיאני זכיות והשתתפות · האלופים תמיד על רקע קוסמי וזהב.</div>
</div>
</body>
</html>
