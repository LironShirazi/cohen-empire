<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="styles.css">
<style>
html,body{padding:0;margin:0;height:100%;overflow:hidden}
.tile{display:flex;width:1280px;height:854px}
.main{flex:1;background:var(--yellow);display:flex;align-items:center;justify-content:center;padding:60px}
.main .name{font-family:var(--font-display);font-size:132px;line-height:.94;color:#1A1206;text-align:center}
.strip{width:300px;display:flex;flex-direction:column}
.strip>div{flex:1}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><div class="name">המירוץ<br>למיליון</div></div>
  <div class="strip">
    <div style="background:#F2B705"></div>
    <div style="background:#E4002B"></div>
    <div style="background:#0B1B3F"></div>
  </div>
</div>
</body>
</html>
